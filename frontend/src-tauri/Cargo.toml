[package]
name = "in-vibe"
version = "0.2.0"
description = "IN-VIBE Annyong desktop companion"
edition = "2021"
rust-version = "1.85"

[lib]
name = "in_vibe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
